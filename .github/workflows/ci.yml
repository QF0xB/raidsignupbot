name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Tests use Quarkus Dev Services (Testcontainers) for the database and never connect to Discord.
      - name: Test
        run: mvn -B verify

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: quarkus-app
          path: target/quarkus-app/
          retention-days: 7

  image:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: quarkus-app
          path: target/quarkus-app/

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The JVM Dockerfile only copies files, so building for arm64 needs no emulation.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/main/docker/Dockerfile.jvm
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/qf0xb/raidsignupbot:latest
            ghcr.io/qf0xb/raidsignupbot:${{ github.sha }}
