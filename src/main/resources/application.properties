quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true

%dev.quarkus.flyway.clean-disabled=false
%dev.quarkus.flyway.clean-at-start=true
%dev.quarkus.flyway.repair-at-start=true
%dev.quarkus.flyway.migrate-at-start=true

%dev.quarkus.datasource.dev-ui.allow-sql=true

# Web UI: log in with Discord. Register <public url>/auth/callback as OAuth2 redirect in the Discord developer portal.
quarkus.oidc.provider=discord
quarkus.oidc.client-id=${DISCORD_APPLICATION_ID:}
quarkus.oidc.credentials.secret=${DISCORD_CLIENT_SECRET:}
quarkus.oidc.authentication.scopes=identify
quarkus.oidc.authentication.add-openid-scope=false
quarkus.oidc.authentication.redirect-path=/auth/callback
quarkus.oidc.authentication.restore-path-after-redirect=true
# Keep Discord's user info in the session cookie instead of calling Discord on every request.
quarkus.oidc.cache-user-info-in-idtoken=true

# Public URL of the web UI, used for links in Discord messages. Leave empty to omit them.
web.base-url=${WEB_BASE_URL:}
# Test mode posts simulated teams and early reminders to real Discord channels; keep it off in production.
web.simulation.enabled=${WEB_SIMULATION_ENABLED:false}
%dev.web.simulation.enabled=true

# Template imports are posted as a single form field; the default limit is 2 KB.
quarkus.http.limits.max-form-attribute-size=4M

quarkus.http.auth.permission.public.paths=/app.css,/logged-out,/favicon.ico
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.web.paths=/*
quarkus.http.auth.permission.web.policy=authenticated

# TLS terminates at the reverse proxy (Traefik), which forwards the original scheme and host.
%prod.quarkus.http.proxy.proxy-address-forwarding=true
%prod.quarkus.http.proxy.allow-x-forwarded=true
%prod.quarkus.http.proxy.enable-forwarded-host=true
%prod.quarkus.oidc.authentication.force-redirect-https-scheme=true
%prod.quarkus.oidc.authentication.cookie-force-secure=true
%prod.quarkus.rest-csrf.cookie-force-secure=true
