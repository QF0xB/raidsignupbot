quarkus.datasource.db-kind=mariadb
quarkus.flyway.migrate-at-start=true
quarkus.datasource.jdbc.additional-jdbc-properties.disableSessionTracking=true

%dev.quarkus.flyway.clean-disabled=false
%dev.quarkus.flyway.clean-at-start=true
%dev.quarkus.flyway.repair-at-start=true
%dev.quarkus.flyway.migrate-at-start=true

%dev.quarkus.datasource.dev-ui.allow-sql=true

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:raidsignupbot;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.flyway.clean-disabled=false
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.http.host-enabled=false
